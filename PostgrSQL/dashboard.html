<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="dashboard-container">
    <h1>Welcome, <span id="userGreeting" style="color: #007bff;">User</span>!</h1>
    <p>Aapne successfully PostgreSQL aur Node.js ke sath login kar liya hai.</p>
    <button id="logoutBtn" class="btn-logout">Logout Account</button>
</div>

<script>
    // Browser ke local storage se user ka naam read kar rahe hain
    const username = localStorage.getItem('username');
    
    // Route protection guard
    if (!username) {
        alert('Security Alert: Please login first!');
        window.location.href = 'login.html';
    } else {
        document.getElementById('userGreeting').innerText = username;
    }

    // Logout function
    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('username');
        window.location.href = 'login.html';
    });
</script>

</body>
</html>
