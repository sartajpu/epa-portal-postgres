<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    
    <div class="sartaz-page">
        <h1>Sartaj Page here ! </h1>
        <h4>visit the site -  <a class="site-btn" href="https://sartazpage.web.app/" target="_blank">Now!</a></h4>
    </div>

    <div class="form-container">
        <h2>Login Page</h2>
        
        <!-- Flash messages display (Success/Error) -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <p class="error-msg" style="color: #4caf50; background-color: rgba(76, 175, 80, 0.1);">{{ message }}</p>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <div class="input-group">
                <label>Email or Mobile Number</label>
                <input type="text" name="login_input" placeholder="Enter email or mobile" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>
            <div class="switch-form-box">
                <p class="switch-form">Don't have an account? <a href="/register">Register here</a></p>
                <p class="switch-form"><a href="/forgot" style="color: #ff5252;">Forgot Password?</a></p>
            </div>

            <button type="submit" class="btn">Login</button>
        </form>
        
        
    </div>
</body>
</html>
